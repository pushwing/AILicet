name: CI

# ⚠️ 트리거를 main 대상 PR 로 한정한다.
#
# 이 저장소는 feature → dev PR 에 CI 를 걸지 않고, dev → main 배포 PR 에서만
# 전체 검증을 돌린다 (.claude/rules/ci-cd.md "검증 게이트" 참고).
# branches 를 비우면 모든 PR 에서 돌아 이 정책이 무의미해진다.
#
# feature → dev 단계의 검증은 .githooks/pre-push 가 로컬에서 담당한다.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (PHP 8.5 · CS Fixer · PHPStan · PHPUnit)
    # MySQL 을 docker run 으로 직접 띄우고 잡 종료 시 정리한다
    # (여러 저장소가 러너를 공유해 고정 포트 대신 임의 포트를 배정받는다).
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f -v ci-mysql-backend-${{ github.run_id }} 2>/dev/null || true
          # 여러 저장소가 self-hosted 러너를 공유해서 고정 포트를 쓰면
          # 다른 저장소의 CI 컨테이너와 충돌할 수 있다. 도커가 골라주는 임의의
          # 빈 호스트 포트를 쓰고, 실제 배정된 포트를 GITHUB_ENV 로 넘긴다.
          docker run -d --name ci-mysql-backend-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=aicura_test \
            -p 127.0.0.1::3306 \
            mysql:8.0
          port=$(docker inspect ci-mysql-backend-${{ github.run_id }} --format '{{ (index (index .NetworkSettings.Ports "3306/tcp") 0).HostPort }}')
          echo "CI_MYSQL_PORT=$port" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            docker exec ci-mysql-backend-${{ github.run_id }} mysqladmin ping -proot --silent && break
            sleep 2
          done

      - name: PHP 런타임 검증
        run: |
          set -euo pipefail
          php -r 'if (version_compare(PHP_VERSION, "8.5.0", "<")) { fwrite(STDERR, "PHP 8.5 이상이 필요합니다.\n"); exit(1); }'
          command -v composer >/dev/null || { echo "Composer가 필요합니다." >&2; exit 1; }
          for extension in mbstring intl mysqli curl dom xml tokenizer; do
            php -m | grep -i -x "$extension" >/dev/null || {
              echo "필수 PHP 확장이 없습니다: $extension" >&2
              exit 1
            }
          done
          if php -m | grep -i -x pcov >/dev/null; then
            echo "coverage driver: pcov"
          elif php -m | grep -i -x xdebug >/dev/null; then
            echo "coverage driver: xdebug"
          else
            echo "coverage driver가 필요합니다: pcov 또는 xdebug" >&2
            exit 1
          fi
          php --version
          composer --version

      - name: Composer 캐시
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 코드 스타일 (php-cs-fixer)
        run: composer cs

      - name: .env 구성 (CI용 DB · JWT)
        run: |
          cp env .env
          sed -i "s|^database.default.hostname = .*|database.default.hostname = 127.0.0.1|" .env
          sed -i "s|^database.default.database = .*|database.default.database = aicura_test|" .env
          sed -i "s|^database.default.password =.*|database.default.password = root|" .env
          sed -i "s|^database.default.port = .*|database.default.port = ${{ env.CI_MYSQL_PORT }}|" .env
          sed -i "s|^database.tests.hostname = .*|database.tests.hostname = 127.0.0.1|" .env
          sed -i "s|^database.tests.password =.*|database.tests.password = root|" .env
          sed -i "s|^database.tests.port = .*|database.tests.port = ${{ env.CI_MYSQL_PORT }}|" .env
          sed -i "s|^JWT_SECRET = .*|JWT_SECRET = ci-test-secret-key-01234567890123456789|" .env

      - name: writable 디렉토리 보장
        run: |
          mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar
          chmod -R 777 writable

      - name: PHPStan (level 6)
        run: composer analyse

      - name: PHPUnit
        env:
          XDEBUG_MODE: coverage
        run: composer test

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f -v ci-mysql-backend-${{ github.run_id }} 2>/dev/null || true

  frontapi:
    name: frontapi (pure PHP · PHPStan · PHPUnit)
    runs-on: [self-hosted, Linux, X64]

    defaults:
      run:
        working-directory: frontapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동
        working-directory: .
        run: |
          docker rm -f -v ci-mysql-frontapi-${{ github.run_id }} 2>/dev/null || true
          # backend 잡·다른 저장소의 CI 와 동시에 돌 수 있어 고정 포트 대신
          # 도커가 골라주는 임의의 빈 호스트 포트를 쓴다.
          docker run -d --name ci-mysql-frontapi-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ailicet \
            -p 127.0.0.1::3306 \
            mysql:8.0
          port=$(docker inspect ci-mysql-frontapi-${{ github.run_id }} --format '{{ (index (index .NetworkSettings.Ports "3306/tcp") 0).HostPort }}')
          echo "CI_MYSQL_PORT=$port" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            docker exec ci-mysql-frontapi-${{ github.run_id }} mysqladmin ping -proot --silent && break
            sleep 2
          done

      - name: PHP 런타임 검증
        run: |
          set -euo pipefail
          php -r 'if (version_compare(PHP_VERSION, "8.5.0", "<")) { fwrite(STDERR, "PHP 8.5 이상이 필요합니다.\n"); exit(1); }'
          command -v composer >/dev/null || { echo "Composer가 필요합니다." >&2; exit 1; }
          for extension in mbstring intl pdo_mysql curl dom xml tokenizer; do
            php -m | grep -i -x "$extension" >/dev/null || {
              echo "필수 PHP 확장이 없습니다: $extension" >&2
              exit 1
            }
          done
          php --version
          composer --version

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level 6)
        run: composer analyse

      - name: PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ env.CI_MYSQL_PORT }}
          DB_NAME: ailicet
          DB_USER: root
          DB_PASS: root
        run: composer test

      - name: 컨테이너 정리
        if: always()
        working-directory: .
        run: docker rm -f -v ci-mysql-frontapi-${{ github.run_id }} 2>/dev/null || true
