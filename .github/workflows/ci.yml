name: CI

# ⚠️ 트리거를 main 대상 PR 로 한정한다.
#
# 이 저장소는 feature → dev PR 에 CI 를 걸지 않고, dev → main 배포 PR 에서만
# 전체 검증을 돌린다 (.claude/rules/ci-cd.md "검증 게이트" 참고).
# branches 를 비우면 모든 PR 에서 돌아 이 정책이 무의미해진다.
#
# feature → dev 단계의 검증은 .githooks/pre-push 가 로컬에서 담당한다.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (PHP 8.5 · CS Fixer · PHPStan · PHPUnit)
    # self-hosted(macOS) 러너는 `services:` 도커 컨테이너를 지원하지 않는다
    # (GitHub Actions 서비스 컨테이너는 Linux 러너 전용). 대신 아래에서
    # MySQL 을 docker run 으로 직접 띄우고 잡 종료 시 정리한다.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f ci-mysql-backend-${{ github.run_id }} 2>/dev/null || true
          # 이 러너에는 시스템 MySQL(mysqld)이 이미 3306을 상시 점유하고 있어
          # CI 전용 포트(13306)로 띄운다.
          docker run -d --name ci-mysql-backend-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=aicura_test \
            -p 13306:3306 \
            mysql:8.0
          for i in $(seq 1 30); do
            docker exec ci-mysql-backend-${{ github.run_id }} mysqladmin ping -proot --silent && break
            sleep 2
          done

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, mysqli, curl, dom, xml, tokenizer
          coverage: pcov

      - name: Composer 캐시
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 코드 스타일 (php-cs-fixer)
        run: composer cs

      - name: .env 구성 (CI용 DB · JWT)
        run: |
          cp env .env
          sed -i '' "s|^database.default.hostname = .*|database.default.hostname = 127.0.0.1|" .env
          sed -i '' "s|^database.default.database = .*|database.default.database = aicura_test|" .env
          sed -i '' "s|^database.default.password =.*|database.default.password = root|" .env
          sed -i '' "s|^database.default.port = .*|database.default.port = 13306|" .env
          sed -i '' "s|^database.tests.hostname = .*|database.tests.hostname = 127.0.0.1|" .env
          sed -i '' "s|^database.tests.password =.*|database.tests.password = root|" .env
          sed -i '' "s|^database.tests.port = .*|database.tests.port = 13306|" .env
          sed -i '' "s|^JWT_SECRET = .*|JWT_SECRET = ci-test-secret-key-01234567890123456789|" .env

      - name: writable 디렉토리 보장
        run: |
          mkdir -p writable/cache writable/logs writable/session writable/uploads writable/debugbar
          chmod -R 777 writable

      - name: PHPStan (level 6)
        run: composer analyse

      - name: PHPUnit
        run: composer test

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f ci-mysql-backend-${{ github.run_id }} 2>/dev/null || true

  frontapi:
    name: frontapi (pure PHP · PHPStan · PHPUnit)
    runs-on: [self-hosted, macOS, ARM64]

    defaults:
      run:
        working-directory: frontapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동
        working-directory: .
        run: |
          docker rm -f ci-mysql-frontapi-${{ github.run_id }} 2>/dev/null || true
          # backend 잡과 동시에 돌 수 있어 다른 호스트 포트(23306)를 쓴다.
          docker run -d --name ci-mysql-frontapi-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ailicet \
            -p 23306:3306 \
            mysql:8.0
          for i in $(seq 1 30); do
            docker exec ci-mysql-frontapi-${{ github.run_id }} mysqladmin ping -proot --silent && break
            sleep 2
          done

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql, curl, dom, xml, tokenizer

      - name: 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level 6)
        run: composer analyse

      - name: PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '23306'
          DB_NAME: ailicet
          DB_USER: root
          DB_PASS: root
        run: composer test

      - name: 컨테이너 정리
        if: always()
        working-directory: .
        run: docker rm -f ci-mysql-frontapi-${{ github.run_id }} 2>/dev/null || true
