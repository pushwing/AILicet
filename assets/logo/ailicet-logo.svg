<svg width="340" height="90" viewBox="0 0 340 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AILicet">
  <defs>
    <linearGradient id="sealGradient" x1="0" y1="0" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D9E75"/>
      <stop offset="1" stop-color="#0A5241"/>
    </linearGradient>
  </defs>

  <!-- 마크: 인허가 인장(seal) + 체크(검증) -->
