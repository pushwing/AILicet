    <path d="M24,41 L35,52 L58,27" fill="none" stroke="#FFFFFF" stroke-width="7.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 워드마크 -->
  <text x="98" y="58" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif"
        font-size="40" font-weight="800" letter-spacing="-0.5" fill="#0A5241">AILicet</text>
</svg>
